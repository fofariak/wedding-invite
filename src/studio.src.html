<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create your invitation · {{BRAND}}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Created using Anthropic Claude. Keep this note on internal versions until a person has reviewed the site. -->
<style>
:root{--bg:#f3efe8;--panel:#fffdf9;--ink:#27211e;--muted:#6f645c;--line:#ddd3c6;--accent:#6e1f2f;--accent-ink:#fff;--field:#fff;--ok:#2f6b4f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:"Avenir Next","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1b1715;--panel:#25201d;--ink:#f1e9df;--muted:#a89c91;--line:#40372f;--accent:#d9a3ad;--accent-ink:#2a1016;--field:#1b1715;--ok:#8fd0b0}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.top{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font:500 24px/1.15 var(--serif);letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.home{font:500 15px var(--serif);color:var(--accent);text-decoration:none}
.paynote{font-size:12.5px;color:var(--muted);margin:0}
.paynote a{color:inherit}
.form{overflow:auto;flex:1;padding:6px 20px 24px;min-height:0}
details{border-bottom:1px solid var(--line);padding:2px 0}
summary{cursor:pointer;padding:12px 0;font:500 17px var(--serif);list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font:400 18px var(--sans)}
details[open]>summary::after{content:"\2212"}
.body{padding:0 0 16px;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:14px var(--sans)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.themes{display:grid;gap:8px}
.theme{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);font-size:14px}
.theme:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme input{accent-color:var(--accent);margin:0}
.sw{display:flex;margin-left:auto}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.cardhead{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.cardhead span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:3px 8px;font:13px var(--sans);cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:10px 14px;font:600 13.5px var(--sans);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.add{justify-self:start;padding:7px 12px}
.photo{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.photo img{width:64px;height:84px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:#ddd}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13.5px}
.check input{accent-color:var(--accent)}
input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.foot{border-top:1px solid var(--line);padding:12px 20px;display:grid;gap:8px}
.foot .row{flex-wrap:nowrap}.foot .btn{flex:1}
#status{font-size:12.5px;color:var(--muted);min-height:18px}
.stage{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.stagebar{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stagebar b{font:500 17px var(--serif);margin-right:auto}
.phonewrap{display:grid;place-items:center;padding:20px;min-height:0;overflow:auto}
.phone{width:min(400px,100%);height:min(820px,calc(100vh - 110px));border-radius:34px;border:10px solid #1d1a18;background:#000;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media (max-width:860px){.app{grid-template-columns:1fr;height:auto}.side{border-right:0}.form{overflow:visible}.phone{height:760px}.stage{border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="top">
      <a class="home" href="index.html">{{BRAND}}</a>
      <h1>Create your invitation</h1>
      <p>Editing and previewing are free. Pay once per wedding to remove the preview mark and download. <button class="mini" id="fresh" type="button">Start a new invite</button></p>
    </div>
    <div class="form" id="form"></div>
    <div class="foot">
      <div class="row">
        <button class="btn" id="export">Download invite</button>
        <button class="btn ghost" id="save">Save project</button>
        <button class="btn ghost" id="load">Open project</button>
      </div>
      <div id="status" role="status"></div>
      <p class="paynote" id="paynote"></p>
      <p class="paynote">Payments are non-refundable. <a href="refunds.html">Refund policy</a> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a></p>
      <input type="file" id="loadfile" accept=".json,application/json" hidden>
    </div>
  </div>
  <div class="stage">
    <div class="stagebar">
      <b>Phone preview</b>
      <label class="check"><input type="checkbox" id="skip" checked> Skip the opening book</label>
      <label class="check"><input type="checkbox" id="pmusic"> Play song in preview</label>
      <button class="mini" id="replay">Replay from start</button>
    </div>
    <div class="phonewrap"><div class="phone"><iframe id="pv" title="Invite preview"></iframe></div></div>
  </div>
</div>

<script>

  })),h('p',{class:'hint',text:'Same animated layout in three colour stories. Event dress-code colours stay as you set them.'}),

      return h('label',{class:'theme'},[r,h('span',{},[TRAD[k].label,h('br'),h('small',{class:'hint',text:TRAD[k].note})])]);})),
    h('button',{class:'btn ghost add',type:'button',text:'Fill in sample '+TRAD[S.tradition].label+' wording',onclick:function(){
      if(!confirm('Replace the names, wording, functions and venue with sample '+TRAD[S.tradition].label+' content? Your photos, song and colours stay.'))return;

    h('p',{class:'hint',text:'The tradition sets the emblem and a few fixed words. The button swaps in sample wording and functions to start from.'})]));

    h('div',{class:'two'},[field('Relation line',S,'rel1'),field('Relation line',S,'rel2')]),
    field('Parents of '+(S.name1||'first')+' (leave empty to hide)',S,'parents1'),field('Parents of '+(S.name2||'second')+' (leave empty to hide)',S,'parents2'),
    field('Line above the names',S,'frontLabel'),field('Invitation line',S,'inviteLine'),
    h('div',{class:'two'},[field('Book cover title',S,'coverTitle'),field('Book cover subtitle',S,'coverSub')])]));
  secs.push(section('Wedding date',false,[
    h('div',{class:'two'},[field('Date',S,'date','date'),field(TRAD[S.tradition].rite+' time',S,'time','time')]),
    (function(){var z=h('select',{},ZONES.map(function(o){return h('option',{value:o[0],selected:S.tz===o[0],text:o[1]});}));z.addEventListener('change',function(){S.tz=z.value;changed();});return h('label',{},['Time zone of the wedding',z]);})(),

        h('button',{class:'mini',type:'button','aria-label':'Move down',disabled:i===S.events.length-1,text:'↓',onclick:function(){move(S.events,i,1);}}),
        h('button',{class:'mini',type:'button',disabled:S.events.length<=3,text:'Remove',onclick:function(){S.events.splice(i,1);changed();render();}})]),
      h('div',{class:'two'},[field('Name',e,'name'),h('label',{},['Artwork',sel])]),
      h('div',{class:'two'},[field('Date',e,'date','date'),field('Time',e,'time','time')]),

      h('label',{class:'check'},[dOn,'Show a dress code']),

      e.dressOn!==false?h('div',{class:'row'},[h('label',{class:'check'},[sOn,'Colour swatch']),e.swatch!==false?c1:null,e.swatch!==false?c2:null,e.swatch!==false?h('label',{class:'check'},[two,'Two colours']):null]):null]);
  }).concat([h('button',{class:'btn ghost add',type:'button',text:'Add a function',onclick:function(){var l=S.events[S.events.length-1];S.events.push({name:'New function',date:l?l.date:S.date,time:'18:00',place:S.venue,dress:'',dressOn:false,c1:'#e9d7ad',c2:'',style:'ceremony'});changed();render();}}),
    h('p',{class:'hint',text:'Keep at least three so the swipe carousel reads well.'})])));
  var up=h('input',{type:'file',accept:'image/*',multiple:true,hidden:true});
  up.addEventListener('change',function(){addPhotos(up.files);});
  secs.push(section('Photos ('+S.photos.length+')',false,S.photos.map(function(ph,i){
    var rep=h('input',{type:'file',accept:'image/*',hidden:true});
    rep.addEventListener('change',function(){if(rep.files[0])shrink(rep.files[0]).then(function(u){ph.src=u;changed();render();},fail);});
    var pos=h('select',{},[['20%','Show top'],['50%','Show centre'],['80%','Show bottom']].map(function(o){return h('option',{value:o[0],selected:(ph.pos||'50%')===o[0],text:o[1]});}));
    pos.addEventListener('change',function(){ph.pos=pos.value;changed();});
    var cov=h('input',{type:'radio',name:'cover',checked:S.cover===i,onchange:function(){S.cover=i;changed();}});
    return h('div',{class:'card'},[h('div',{class:'photo'},[h('img',{src:ph.src,alt:''}),h('div',{style:'display:grid;gap:8px'},[
      field('Caption',ph,'caption'),
      h('div',{class:'row'},[h('button',{class:'mini',type:'button',text:'Replace',onclick:function(){rep.click();}}),rep,pos,
        h('button',{class:'mini',type:'button','aria-label':'Move up',disabled:i===0,text:'↑',onclick:function(){moveP(i,-1);}}),
        h('button',{class:'mini',type:'button','aria-label':'Move down',disabled:i===S.photos.length-1,text:'↓',onclick:function(){moveP(i,1);}}),
        h('button',{class:'mini',type:'button',disabled:S.photos.length<=3,text:'Remove',onclick:function(){S.photos.splice(i,1);if(S.cover>=S.photos.length)S.cover=0;else if(S.cover>i)S.cover--;else if(S.cover===i)S.cover=0;changed();render();}})]),

  }).concat([h('button',{class:'btn ghost add',type:'button',text:'Add photos',onclick:function(){up.click();}}),up,
    h('p',{class:'hint',text:'Portrait photos work best. Photos are resized and stored inside the invite file.'})])));
  var recOn=h('input',{type:'checkbox',checked:S.recOn,onchange:function(){S.recOn=recOn.checked;changed();}});
  secs.push(section('Reception',false,[h('label',{class:'check'},[recOn,'Show the reception card']),
    h('div',{class:'two'},[field('Small line',S,'recLabel'),field('Heading',S,'recTitle')]),
    field('Date',S,'recDate','date'),field('Time and details',S,'recLine'),field('Venue',S,'recVenue'),field('Dress code chip (leave empty to hide)',S,'recChip')]));
  secs.push(section('Venue & map',false,[field('Venue name',S,'venue'),field('Address',S,'address'),field('City (large background word)',S,'city'),
    h('div',{class:'three'},[field('Map: area label',S,'mapArea'),field('Map: landmark',S,'mapLandmark'),field('Map: road',S,'mapRoad')]),
    h('p',{class:'hint',text:'The map is an illustration; only its three labels change. The Maps and Directions buttons search for the venue name and address.'})]));

  sf.addEventListener('change',function(){var f=sf.files[0];if(!f)return;if(f.size>8*1024*1024){say('That song is over 8 MB. Trim it to a 30 to 60 second clip first.');return;}
    var r=new FileReader();r.onload=function(){S.song=r.result;S.songName=f.name;changed();render();};r.onerror=fail;r.readAsDataURL(f);});

function move(arr,i,d){var t=arr[i];arr[i]=arr[i+d];arr[i+d]=t;changed();render();}
function moveP(i,d){var cv=S.photos[S.cover];move(S.photos,i,d);S.cover=S.photos.indexOf(cv);render();}
function shrink(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file),im=new Image();

function fail(){say('That file could not be read. Try a JPG or PNG photo, or an MP3 song.');}

/* ---------- preview ---------- */
var pv=document.getElementById('pv'),timer=null,lastScroll=0,dirty=false,statusEl=document.getElementById('status');
function say(t){statusEl.textContent=t;}
addEventListener('message',function(e){if(e.source===pv.contentWindow&&e.data&&typeof e.data.inviteScroll==='number')lastScroll=e.data.inviteScroll;});
function refresh(fromTop){var skip=document.getElementById('skip').checked;
  if(fromTop)lastScroll=0;
  pv.srcdoc=build({preview:true,mark:!unlocked(),skip:skip&&!fromTop,scroll:lastScroll,silent:!document.getElementById('pmusic').checked});}
function changed(){dirty=true;clearTimeout(timer);timer=setTimeout(function(){rekey().then(function(){refresh(false);});},700);clearTimeout(saveT);saveT=setTimeout(saveDraft,1500);}
document.getElementById('skip').addEventListener('change',function(){refresh(false);});
document.getElementById('pmusic').addEventListener('change',function(){refresh(false);});
document.getElementById('replay').addEventListener('click',function(){refresh(true);});

/* ---------- save / open / export ---------- */
function slug(){return (S.name1+(S.tradition==='hindu'?'-weds-':'-and-')+S.name2).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'wedding-invite';}
function download(name,text,type){var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=h('a',{href:u,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);}

/* ---------- drafts (kept in this browser so nothing is lost when paying) ---------- */
var saveT=null;
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('inviteStudio',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function saveDraft(){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(S,'draft');tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}).catch(function(){});}
function loadDraft(){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('kv').objectStore('kv').get('draft');q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}

/* ---------- payment: one purchase unlocks one couple + wedding date ---------- */
var FN='/.netlify/functions/',CFG=null,curKey='',LIC={};
try{LIC=JSON.parse(localStorage.getItem('inviteLicences')||'{}')||{};}catch(e){LIC={};}
function keepLic(){try{localStorage.setItem('inviteLicences',JSON.stringify(LIC));}catch(e){}}
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
function rekey(){var raw=norm(S.name1)+'|'+norm(S.name2)+'|'+S.date;
  if(!(window.crypto&&crypto.subtle)){curKey='';paintPay();return Promise.resolve();}
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)).then(function(buf){curKey=[].map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');paintPay();},function(){curKey='';paintPay();});}
function unlocked(){return !!(curKey&&LIC[curKey]);}
function price(){if(!CFG)return '';try{var f=new Intl.NumberFormat(undefined,{style:'currency',currency:CFG.currency.toUpperCase()}),d=f.resolvedOptions().maximumFractionDigits;return f.format(CFG.amount/Math.pow(10,d));}catch(e){return (CFG.amount/100)+' '+CFG.currency.toUpperCase();}}
function paintPay(){var b=document.getElementById('export'),n=document.getElementById('paynote');
  if(unlocked()){b.textContent='Download invite';b.disabled=false;n.textContent='Paid for '+S.name1+' & '+S.name2+'. Edit photos, wording, venue and design as often as you like and download again.';}
  else if(CFG&&CFG.ready){b.textContent='Pay '+price()+' and download';b.disabled=false;n.textContent='One payment covers one couple and wedding date.'+(CFG.testMode?' Test mode: no real money is taken.':'');}
  else{b.textContent='Download unavailable';b.disabled=true;n.textContent=CFG?'Payments are not set up on this site yet.':'Checking the payment set-up…';}}
function api(name,opt){return fetch(FN+name,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.error||'Request failed');return j;});});}
function doDownload(){var holders=S.photos.filter(function(p){return p.src.indexOf('data:image/svg')===0;}).length;
  download(slug()+'.html',build({}),'text/html');
  say('Downloaded '+slug()+'.html'+(holders?' (it still has '+holders+' placeholder photo'+(holders>1?'s':'')+')':'')+(S.song?'':' without a song')+'.');}
document.getElementById('export').addEventListener('click',function(){var b=this;
  rekey().then(function(){
    if(!curKey){say('This browser cannot start a payment. Open the site over https in a current browser.');return;}
    b.disabled=true;
    if(unlocked()){say('Checking your purchase…');
      return api('verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:curKey,token:LIC[curKey]})}).then(function(j){
        if(j.ok){doDownload();}else{delete LIC[curKey];keepLic();say('That purchase could not be confirmed. Pay again or contact support.');refresh(false);}});}
    say('Opening secure checkout…');
    return saveDraft().then(function(){return api('create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:curKey,label:(S.name1+' & '+S.name2).slice(0,80)})});}).then(function(j){location.href=j.url;});
  }).catch(function(e){say('Could not reach the payment service. '+(e&&e.message||'')+' Try again in a moment.');}).then(function(){paintPay();});});
document.getElementById('fresh').addEventListener('click',function(){if(!confirm('Start a new invite? The current draft in this browser is cleared. Save the project first if you want to keep it.'))return;S=defaults();render();rekey().then(function(){refresh(true);});saveDraft();say('New invite started.');});
document.getElementById('save').addEventListener('click',function(){download(slug()+'.invite.json',JSON.stringify({inviteStudio:1,data:S,licences:LIC}),'application/json');dirty=false;say('Project saved. Open it here later to keep editing.');});
document.getElementById('load').addEventListener('click',function(){document.getElementById('loadfile').click();});
document.getElementById('loadfile').addEventListener('change',function(){var f=this.files[0];this.value='';if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!j.inviteStudio||!j.data||!Array.isArray(j.data.photos)||!Array.isArray(j.data.events)||j.data.photos.length<1)throw 0;
      S=Object.assign(defaults(),j.data);if(!THEMES[S.theme])S.theme='wine';if(!TRAD[S.tradition])S.tradition='hindu';if(!(S.cover>=0&&S.cover<S.photos.length))S.cover=0;if(j.licences&&typeof j.licences==='object'){Object.keys(j.licences).forEach(function(k){if(/^[0-9a-f]{64}$/.test(k)&&typeof j.licences[k]==='string')LIC[k]=j.licences[k];});keepLic();}render();rekey().then(function(){refresh(true);});saveDraft();dirty=false;say('Opened '+f.name+'.');}
    catch(e){say('That is not an Invite Studio project file. Pick a file ending in .invite.json.');}};
  r.readAsText(f);});


/* ---------- start-up ---------- */
paintPay();
api('config').then(function(c){CFG=c;},function(){CFG={ready:false};}).then(paintPay);
loadDraft().then(function(d){
  if(d&&Array.isArray(d.photos)&&d.photos.length&&Array.isArray(d.events)){S=Object.assign(defaults(),d);if(!THEMES[S.theme])S.theme='wine';if(!TRAD[S.tradition])S.tradition='hindu';if(!(S.cover>=0&&S.cover<S.photos.length))S.cover=0;}
  render();return rekey();
}).then(function(){
  var q=new URLSearchParams(location.search),sid=q.get('paid');
  if(q.has('paid')||q.has('cancelled'))history.replaceState(null,'',location.pathname);
  if(q.has('cancelled'))say('Payment cancelled. Nothing was charged and your draft is still here.');
  if(sid&&/^cs_[A-Za-z0-9_]+$/.test(sid)){say('Confirming your payment…');
    return api('verify?session_id='+encodeURIComponent(sid)).then(function(j){
      if(j.ok&&j.key&&j.token){LIC[j.key]=j.token;keepLic();paintPay();say(j.key===curKey?'Payment received. Your invite is unlocked: press Download invite.':'Payment received for a different couple or date than the one on screen. Change the names and date back to download.');}
      else say('That payment is not complete yet. If you were charged, reload this page in a minute.');
    },function(){say('Could not confirm the payment. Reload this page to try again.');});}
}).then(function(){refresh(false);});
})();
</script>
</body>
